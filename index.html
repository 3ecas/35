<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport"
              content="width=device-width, initial-scale=1, maximum-scale=1,
                       user-scalable=no, viewport-fit=cover" />
        <title>35</title>

        <link rel="stylesheet" href="css/theme.css" />
        <link rel="stylesheet" href="css/components.css" />
        <link rel="stylesheet" href="css/game.css" />
        <link rel="stylesheet" href="css/charges.css" />
        <link rel="stylesheet" href="css/backdrop.css" />
        <link rel="stylesheet" href="css/numbers.css" />
    </head>
    <body class="game">
        <div class="backdrop" id="backdrop" aria-hidden="true"></div>

        <nav class="tools" aria-label="Game">
            <button class="tool" id="howBtn" type="button" data-icon="help"
                    aria-label="How to play"></button>
            <button class="tool" type="button" data-sound aria-label="Sound"></button>
            <button class="tool" id="restartBtn" type="button" data-icon="restart"
                    aria-label="Start over" data-confirm="Tap again to start over"></button>
        </nav>

        <main class="table">
            <div class="stage">
                <div class="scoreboard" id="scoreboard" aria-live="off">
                    <span class="scoreboard__value"></span>
                    <span class="scoreboard__best"></span>
                </div>

                <div class="board" id="board" aria-label="Board"></div>

                <div class="tray">
                    <div class="hand" id="hand"></div>

                    <button class="dial dial--bomb" id="bombDial" type="button" disabled
                            data-charge="bomb" data-lit="#2d2a2e"
                            aria-label="Take a bomb">
                        <canvas class="dial__ink"></canvas>
                        <span class="dial__mark" data-icon="n0"></span>
                    </button>
                </div>
            </div>
        </main>

        <div class="how" id="how"></div>
        <div class="over" id="over"></div>

        <script src="js/core/config.js"></script>
        <script src="js/core/events.js"></script>
        <script src="js/core/storage.js"></script>

        <script src="js/data/pieces.js"></script>

        <script src="js/systems/board.js"></script>
        <script src="js/systems/round.js"></script>
        <script src="js/systems/charges.js"></script>

        <script src="js/ui/icons.js"></script>
        <script src="js/ui/sound.js"></script>
        <script src="js/ui/toast.js"></script>
        <script src="js/ui/shatter.js"></script>
        <script src="js/ui/effects.js"></script>
        <script src="js/ui/boardview.js"></script>
        <script src="js/ui/howto.js"></script>
        <script src="js/ui/roundview.js"></script>
        <script src="js/ui/scoreview.js"></script>
        <script src="js/ui/chargeview.js"></script>
        <script src="js/ui/backdrop.js"></script>

        <script src="js/pages/game.js"></script>
    </body>
</html>
